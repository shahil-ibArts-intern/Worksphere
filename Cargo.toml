[workspace]
members = [
    "domain",
    "db",
    "auth",
    "realtime",
    "services",
    "api",
    "search",
    "storage",
    "email",
    "whiteboard",
    "app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Dayshift Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1", features = ["full"] }
http = "1"
bytes = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
validator = { version = "0.16", features = ["derive"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v7", "serde"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "builder", "ring", "rustls-native-certs"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Redis
fred = { version = "8", features = ["enable-rustls"] }

# Search
meilisearch-sdk = "0.27"

# Rate limiting
governor = "0.6"

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# CRDT
automerge = "0.5"
automerge_repo = "0.1"

# Compression
zstd = "0.13"

# Geometry
geo = "0.28"

# Graph
petgraph = "0.6"

# Binary serde
bincode = "1.3"

# SVG/PNG export
resvg = "0.37"
usvg = "0.41"
tiny-skia = "0.11"

# Metrics
metrics = "0.22"

# TS codegen
ts-rs = "0.10"

# Async trait
async-trait = "0.1"

# Internal crates
domain = { path = "domain" }
db = { path = "db" }
auth = { path = "auth" }
realtime = { path = "realtime" }
services = { path = "services" }
api = { path = "api" }
search = { path = "search" }
storage = { path = "storage" }
email = { path = "email" }
whiteboard = { path = "whiteboard" }
